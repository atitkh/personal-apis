version: '3.8'

services:
  nodejs:
    build:
      context: .
      dockerfile: Dockerfile
    image: nodejs
    container_name: nodejs
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=America/Chicago
    ports:
      - "3000:3000"
    volumes:
      - ./:/home/node/app
      - node_modules:/home/node/app/node_modules
    command: sh -c "cd /home/node/app && npm install --production && npm start"
    networks:
      - akapi-network

networks:
  akapi-network:
    driver: bridge

volumes:
  node_modules:
