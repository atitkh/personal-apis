version: '3.8'

services:
  personal-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-hub
    container_name: personal-hub
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=America/Chicago
    ports:
      - "3000:3000"
    volumes:
      # The source is bind-mounted (dashboard files are served from disk; code changes apply on restart).
      - ./:/home/node/app
      # NAS folder for hub backups (Settings > Backups folder = /backups-nas)
      - /media/voltex/nasbackups/personal-hub:/backups-nas
    # Hides the host's own node_modules folder: the container uses the packages baked into the image (/opt/deps).
    tmpfs:
      - /home/node/app/node_modules
    networks:
      akapi-network:
        # The old container name, kept so anything that still reaches the hub as "nodejs" on this network keeps working.
        aliases:
          - nodejs

networks:
  akapi-network:
    driver: bridge
