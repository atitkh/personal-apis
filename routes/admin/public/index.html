<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <!-- The browser bar follows the system scheme; theme.js points both at the picked theme. -->
    <meta name="theme-color" content="#E8ECEF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0D1320" media="(prefers-color-scheme: dark)">
    <title>Personal hub</title>
    <link rel="preload" href="fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
    <!-- Sets the theme before the first paint, so a dark page never flashes white. -->
    <script src="theme-boot.js"></script>
    <script type="module" src="app.js"></script>
</head>
<body>
    <div id="app"></div>
    <noscript><p class="noscript">The dashboard needs JavaScript.</p></noscript>
</body>
</html>
